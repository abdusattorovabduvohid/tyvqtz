# Еженедельная резервная копия базы.
#
# На бесплатном тарифе Supabase автоматических бэкапов НЕТ вообще: если данные
# потеряются (неудачный `prisma db push`, ошибочный DELETE), восстановить их
# неоткуда. Этот воркфлоу снимает дамп и кладёт его в артефакты Actions.
#
# Что нужно один раз настроить руками:
#   Settings → Secrets and variables → Actions → New repository secret
#   Имя:      SUPABASE_DB_URL
#   Значение: строка POSTGRES_URL_NON_POOLING из .env
#
# Важно: именно NON_POOLING. Обычный адрес идёт через pgbouncer, а он не
# поддерживает служебные запросы pg_dump — дамп получится битым.

name: Резервная копия базы

on:
  schedule:
    # Каждое воскресенье в 03:00 UTC — это 08:00 по Ташкенту.
    - cron: "0 3 * * 0"
  # Ручной запуск со вкладки Actions: нужен, чтобы снять дамп ПЕРЕД
  # каждым `prisma db push` — самой опасной операцией в проекте.
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Снять дамп
        env:
          # Читаем секрет в промежуточную переменную и чистим его ниже.
          # При вставке в веб-форму GitHub в конец значения попадает перевод
          # строки, и pg_dump падает с «invalid sslmode value: require\n».
          # Чиним это здесь, а не просим человека переклеивать секрет:
          # второй раз наступать на те же грабли незачем.
          RAW_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # pg_dump отказывается работать, если его версия старше версии
        # сервера. Системный клиент раннера отстаёт и ломается после
        # очередного апгрейда Postgres на стороне Supabase, поэтому берём
        # официальный образ с зафиксированной версией. Если появится ошибка
        # «server version mismatch» — поднять тег postgres:NN.
        run: |
          set -euo pipefail

          # Пробелов в строке подключения быть не может, поэтому смело
          # вычищаем любые — вместе с переводом строки из формы.
          DB_URL="$(printf '%s' "$RAW_DB_URL" | tr -d '[:space:]')"
          # И кавычки, если значение скопировали из .env вместе с ними.
          DB_URL="${DB_URL%\"}"
          DB_URL="${DB_URL#\"}"

          # Очищенное значение отличается от секрета, поэтому автоматическая
          # маскировка GitHub на него не действует — маскируем вручную.
          echo "::add-mask::$DB_URL"

          case "$DB_URL" in
            postgres://*|postgresql://*) ;;
            "") echo "::error::Секрет SUPABASE_DB_URL пуст"; exit 1 ;;
            *)  echo "::error::SUPABASE_DB_URL не похож на строку подключения"; exit 1 ;;
          esac

          mkdir -p dump
          # Передаём переменную по имени, а не значением: так строка с паролем
          # не попадает в список процессов раннера.
          export DB_URL
          docker run --rm -e DB_URL -v "$PWD/dump:/dump" postgres:17 \
            sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges -f /dump/backup.sql'
          gzip -9 dump/backup.sql
          mv dump/backup.sql.gz "dump/tyvqtz-$(date +%F).sql.gz"
          ls -lh dump

      # Дамп содержит персональные данные сотрудников, поэтому он идёт в
      # артефакты, а НЕ в репозиторий: в гите он остался бы навсегда и попал
      # бы к каждому, у кого есть доступ к коду.
      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: dump/*.sql.gz
          retention-days: 90
          if-no-files-found: error
